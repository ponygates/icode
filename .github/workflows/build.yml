name: Build & Release

# Multi-platform auto-build CI for iCode.
#   • Test+Frontend run on every push / PR.
#   • Desktop GUI binaries are built on NATIVE runners with CGO (systray +
#     global hotkey need Cocoa on macOS / GTK+appindicator on Linux).
#   • Headless CLI binaries are pure-Go cross-compiles (CGO_ENABLED=0,
#     -tags nogui) from a single Linux runner — no CGO, no GUI libs.
#   • A version tag (v*) triggers a GitHub Release with all assets.

on:
  push:
    tags: ['v*']
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '22'

jobs:
  # ============================================================================
  # Test + Vet — every push / PR (compiles the desktop packages too)
  # ============================================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux desktop deps (CGO systray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libayatana-indicator3-dev

      # internal/embedded/dist is git-ignored (real bundle built in the frontend
      # job). These compile-only jobs just need //go:embed dist to have a file.
      - name: Stub embedded frontend (compile-only)
        shell: bash
        run: |
          mkdir -p internal/embedded/dist
          echo '<!doctype html><meta charset="utf-8"><title>iCode</title><body>iCode UI stub (test build)</body>' > internal/embedded/dist/index.html

      - name: Build all packages
        run: go build ./...
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}

      - name: Vet all packages
        run: go vet ./...
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}

      - name: Check gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run all tests
        run: go test -count=1 -timeout=180s ./...
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}

      # Race detector catches data races that the plain run misses. It needs
      # CGO_ENABLED=1, so only run it on Linux/macOS (Windows GUI build is
      # CGO-free). Catches the goroutine/concurrent-map class of bugs that
      # historically caused silent data corruption in iCode.
      - name: Run tests with race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout=300s ./...
        env:
          CGO_ENABLED: '1'

      # Coverage gate: fail the build if coverage drops below the floor.
      # Reported as an artifact so regressions are visible in PR review.
      - name: Generate coverage report
        if: runner.os == 'Linux'
        run: |
          go test -count=1 -timeout=300s -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
        env:
          CGO_ENABLED: '1'

      - name: Run govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ============================================================================
  # Frontend — build desktop frontend for embedding
  # ============================================================================
  frontend:
    name: Build Desktop Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check frontend
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: desktop
        run: npm test

      - name: Build frontend
        working-directory: desktop
        run: npx vite build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: desktop/dist/

  # ============================================================================
  # Desktop GUI binaries — native runners, CGO for systray / hotkey
  # ============================================================================
  build-desktop:
    name: Desktop (${{ matrix.os }} / ${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    needs: [test, frontend]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            cgo: '1'
          - os: macos-13
            goarch: amd64
            cgo: '1'
          - os: macos-14
            goarch: arm64
            cgo: '1'
          - os: windows-latest
            goarch: amd64
            cgo: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux desktop deps (CGO systray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev libayatana-indicator3-dev

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/embedded/dist/

      - name: Build desktop binary
        shell: bash
        run: |
          SUFFIX=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then SUFFIX=".exe"; fi
          LDFLAGS="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.GitCommit=${GITHUB_SHA}"
          if [ "$SUFFIX" = ".exe" ]; then LDFLAGS="$LDFLAGS -H windowsgui"; fi
          GOARCH=${{ matrix.goarch }} CGO_ENABLED=${{ matrix.cgo }} go build -tags desktop_only -ldflags="$LDFLAGS" -o icode-desktop-${{ matrix.os }}-${{ matrix.goarch }}$SUFFIX .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: icode-desktop-${{ matrix.os }}-${{ matrix.goarch }}
          path: icode-desktop-${{ matrix.os }}-${{ matrix.goarch }}*

  # ============================================================================
  # Simple UI (Windows WebView2 lightweight window) — the double-click-friendly
  # "UI 版". Released as icode-simpleui-* to end the icode-cli naming collision
  # with the headless cross-compiles below.
  build-simpleui:
    name: SimpleUI (windows)
    runs-on: windows-latest
    needs: [test, frontend]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/embedded/dist

      - name: Build simpleui binary
        shell: bash
        run: |
          go build -tags simpleui -ldflags="-s -w -H windowsgui -X main.Version=${GITHUB_REF_NAME#v}" -o icode-simpleui-windows-amd64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: icode-simpleui-windows-amd64
          path: icode-simpleui-windows-amd64*

  # ============================================================================
  # Headless CLI binaries — pure-Go cross-compile (-tags nogui, no CGO)
  #   Covers architectures the GUI native-runner matrix does not (linux/arm64,
  #   windows/arm64, freebsd, …) from a single Linux runner.
  # ============================================================================
  build-cli:
    name: CLI (${{ matrix.goos }} / ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Headless CLI still imports internal/embedded (server serves the UI),
      # so //go:embed dist needs at least one file even without a real bundle.
      - name: Stub embedded frontend
        run: |
          mkdir -p internal/embedded/dist
          echo '<!doctype html><meta charset="utf-8"><title>iCode</title><body>iCode UI stub (headless CLI)</body>' > internal/embedded/dist/index.html

      - name: Cross-compile headless CLI
        run: |
          SUFFIX=""
          if [ "${{ matrix.goos }}" = "windows" ]; then SUFFIX=".exe"; fi
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -tags nogui \
            -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME#v} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X main.GitCommit=${GITHUB_SHA}" \
            -o icode-cli-${{ matrix.goos }}-${{ matrix.goarch }}$SUFFIX .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: icode-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: icode-cli-${{ matrix.goos }}-${{ matrix.goarch }}*

  # ============================================================================
  # Release — create GitHub Release on version tags
  # ============================================================================
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: icode-*
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x icode-cli-* icode-desktop-* 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            icode-desktop-*
            icode-cli-*
          generate_release_notes: true
