# ============================================================================
# golangci-lint configuration for iCode — v2 schema (golangci-lint >= 2.0).
#
# PHILOSOPHY: this gate is GREEN ON DAY ONE and catches real regressions.
# Everything below was produced by actually running `golangci-lint run ./...`
# on this tree (v2.14.0). Rules are narrowed by path AND message text so new
# problems in the same file are still reported — no blanket linter switches.
# Every allowlist entry carries a one-line reason.
#
# Local:  golangci-lint run ./...    (go install
#         github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest)
# CI:     the "Lint" job in .github/workflows/build.yml.
# ============================================================================
version: "2"

run:
  timeout: 15m
  # No build-tags override: CI must lint the exact view `go test ./...` compiles.
  # Adding `-tags nogui` here turns perfectly reachable TUI methods into bogus
  # "unused" findings, because the tag hides their only callers.

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused — exactly the
  # set the audit asked for, minus the formatters (v2 moved gofmt/goimports into
  # `formatters` below) and minus `gosimple`, which golangci-lint v2 folded into
  # staticcheck (its S1xxx checks come from the `checks: [all]` list).
  default: standard
  settings:
    errcheck:
      # `_ = f()` is this codebase's idiom for "failure intentionally ignored";
      # flagging the blank assignment would fight the house style.
      check-blank: false
      check-type-assertions: false
      # Cleanup / best-effort-write policy instead of 30 per-file allowlist
      # entries: Close on an already-abandoned handle and writes to a terminal
      # have nothing actionable to do with the error, and `defer x.Close()` is
      # the house idiom. Everything else (real error returns) stays checked.
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
        - (*os.File).Write
        - (*os.File).WriteString
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # Partial-parse helper: a short scan is a valid outcome and every call
        # site already handles the zero-value case.
        - fmt.Sscanf
        # Win32 trampolines / registry handles in cleanup paths — a non-zero
        # return cannot be acted on and there is nothing to propagate to.
        - (*golang.org/x/sys/windows.LazyProc).Call
        - (golang.org/x/sys/windows/registry.Key).Close
    staticcheck:
      checks:
        - all
        # House style is comment-free packages and mixed receiver naming; turning
        # these on means touching ~300 files unrelated to any change.
        - -ST1000 # package comments
        - -ST1003 # underscore/camel-case naming
        - -ST1005 # error string punctuation
        - -ST1016 # consistent method receiver names
        - -ST1020 # exported function comments
        - -ST1021 # exported type comments
        - -ST1022 # exported variable comments
        # Pure-cosmetic rewrites (no behaviour risk, but mass edits): flagged on
        # day one only to keep the gate honest rather than noisy.
        - -QF1001 # De Morgan's law suggestion
        - -QF1002 # tagged switch suggestion
        - -QF1003 # tagged switch suggestion (variant)
        - -QF1011 # omit redundant type in declaration
        - -QF1012 # fmt.Fprintf over WriteString(fmt.Sprintf(..))
        - -S1002 # `== false` simplification
        - -S1011 # append loop → append(slice, elems...)
        - -S1017 # TrimPrefix/TrimSuffix suggestion
        - -S1029 # range a string directly instead of []rune(string)
        - -S1033 # redundant guard before delete
        - -S1039 # unnecessary fmt.Sprintf on a constant string
        - -SA6003 # ranging a string as []rune (kept for ASCII fast paths)
  exclusions:
    generated: lax
    # Adopting a linter on a 300-file legacy tree without a wall of per-line
    # exceptions: golangci-lint's own curated bundles. `std-error-handling` =
    # best-effort Close/Write/Print in cleanup paths; `comments` = TODO/Fixme
    # annotations; `common-false-positives` + `legacy` = the historical
    # false-positive set. New, genuinely wrong code is still reported.
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # ── pre-existing debt, allowlisted with a reason ───────────────────────
      # Match on the MESSAGE (text) rather than the file where possible: this
      # tree is refactored constantly and a path rule silently stops applying
      # the moment a function moves to another file. Remove an entry when the
      # debt itself is fixed — do not add new ones casually.
      - path: _test\.go$
        linters: [errcheck, unused, staticcheck]
        reason: "测试里的 best-effort 清理、占位断言分支与辅助谓词函数不参与生产逻辑"

      # ── win32 trampolines: LazyProc.Call's error is unactionable here ─────
      # Covers computeruse_windows / recorder_windows / codepage_windows /
      # clipboard_windows / secrets_windows / resize_windows / screenread_*:
      # these are Close/Set/Free-style calls where a non-zero return cannot be
      # propagated anywhere useful.
      - linters: [errcheck]
        text: "Error return value of `[A-Za-z_][A-Za-z0-9_]*\\.Call` is not checked"
        reason: "golang.org/x/sys/windows 的 LazyProc.Call 垫片，错误无可返回处"

      # ── best-effort persistence / streaming writes (pre-existing) ─────────
      - path: pkg/modelupdate/service.go
        linters: [errcheck]
        reason: "模型清单落盘尽力而为：写失败时缓存文件本就可缺省，改返回错误会打断刷新流程"

      - path: internal/server/
        linters: [errcheck]
        reason: "SSE/HTTP 已关闭连接后的写入与清理失败无可恢复，loopback 服务刻意不中止请求"

      - linters: [errcheck]
        text: "sessionSt.AppendMessage"
        reason: "会话附加失败由上层重试兜底，引擎刻意不因持久化抖动中断对话"

      - linters: [errcheck]
        text: "\\(\\*encoding/json\\.Encoder\\)\\.Encode"
        reason: "响应已 flush 给客户端时 Encoder 错误无处可报（handlers_skills 的 SSE/JSON 输出）"

      # ── dead code under construction / other build tags ───────────────────
      # `unused` only sees the tag view CI compiles, so helpers that live on the
      # desktop_only / nogui / in-refactor path look dead. Named explicitly so a
      # genuinely orphaned new symbol still fails.
      - linters: [unused]
        text: "(showCLIMessage|openBrowser|siMutex|mu|calculateCost|procMapVirtualKey|point|pluralS|sseSessionID|errDropped|saveInputHistory|enableMouse|restoreVimUndo|scrollToTop|scrollToBottom|scrollUp|scrollDown|fit|padEnd) is unused"
        reason: "重构中/其他构建标签下才可达的 TUI 与 cmd 辅助符号，删除会丢功能"

      # ── ineffectual assignments that need a semantic decision ─────────────
      - linters: [ineffassign]
        text: "ineffectual assignment to (candidates|cwd|style|maxChars)"
        reason: "赋值意图本身待判定（是用初值还是补计算），修复要连上下文一起改，登记待清理"

      - linters: [ineffassign]
        text: "absCmd"
        reason: "命令归一化的末次赋值属于安全判定路径，改动需配回归用例，另行专项处理"

      - linters: [ineffassign, staticcheck]
        text: "maxChars"
        reason: "默认预算在后续分支被覆盖，删除赋值会改变兜底行为，待预算逻辑收敛后清理"

      - linters: [ineffassign]
        text: "eventsProduced"
        reason: "流式重试计数器的中间赋值供日志使用，需连 fallback 一起重构"

      - linters: [staticcheck]
        text: "SA4023"
        reason: "接口非 nil 判定是防御式写法，移除需先确认 openAIContent 的调用方契约（含其关联信息行）"

      - linters: [staticcheck]
        text: "SA9003"
        reason: "scheduler 预留的调度分支占位，待模板去重实现填充"

      - linters: [unused]
        text: "featurize is unused"
        reason: "IDF/BM25 备用特征函数，RAG 调参期间刻意保留"

      - linters: [unused]
        text: "checkParamRules is unused"
        reason: "参数级规则引擎半成品，接入 hooks 前刻意保留"

      - linters: [unused]
        text: "isRejectedTurn is unused"
        reason: "淘汰策略回滚开关，压缩实验期间刻意保留"

formatters:
  # v2 keeps gofmt/goimports out of `linters`; CI fails on either.
  enable:
    - gofmt
    - goimports
