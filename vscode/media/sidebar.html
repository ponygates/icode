<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'nonce-${nonce}'; font-src data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iCode</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #252526;
      --border: #3c3c3c;
      --text: #d4d4d4;
      --muted: #8a8a8a;
      --accent: #2563eb;
      --user: #2b3a55;
      --assistant: #2d2d2d;
      --tool: #3a2f1a;
      --error: #f48771;
      --ok: #4ec9b0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    #header .title { font-weight: 600; }
    #status { font-size: 11px; color: var(--muted); margin-left: auto; }
    #body { flex: 1; display: flex; min-height: 0; }
    #sidebar {
      width: 160px; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--panel);
    }
    #sessions { flex: 1; overflow-y: auto; }
    .session-item {
      padding: 6px 8px; cursor: pointer; border-bottom: 1px solid var(--border);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .session-item:hover { background: #2a2d2e; }
    .session-item.active { background: #094771; }
    #newSession {
      padding: 8px; border: none; background: var(--accent); color: #fff;
      cursor: pointer; font-size: 12px;
    }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #modelbar {
      padding: 6px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; background: var(--panel);
    }
    #modelbar select {
      background: #3c3c3c; color: var(--text); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 6px; font-size: 12px; max-width: 240px;
    }
    #messages { flex: 1; overflow-y: auto; padding: 10px; }
    .msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: var(--user); align-self: flex-end; }
    .msg.assistant { background: var(--assistant); }
    .msg.tool { background: var(--tool); font-family: monospace; font-size: 12px; }
    .msg.error { background: #3a1d1d; color: var(--error); }
    .msg.thinking { color: var(--muted); font-style: italic; }
    .tool-call { border-left: 3px solid #c19a4b; padding-left: 8px; margin: 4px 0; }
    .tool-call .name { font-weight: 600; color: #e0b96a; }
    .perm { border: 1px solid var(--border); border-radius: 6px; padding: 8px; margin: 6px 0; }
    .perm .btns { margin-top: 6px; display: flex; gap: 6px; }
    .perm button { padding: 3px 10px; border: none; border-radius: 4px; cursor: pointer; }
    .perm .allow { background: var(--ok); color: #06281f; }
    .perm .deny { background: #5a2a2a; color: #fff; }
    #inputbar {
      border-top: 1px solid var(--border); padding: 8px 10px;
      display: flex; gap: 8px; align-items: flex-end; background: var(--panel);
    }
    #input {
      flex: 1; resize: none; height: 52px; background: #1e1e1e; color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 6px; font-size: 13px;
      font-family: inherit;
    }
    #send, #stop {
      padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer;
      color: #fff; font-size: 13px;
    }
    #send { background: var(--accent); }
    #stop { background: #5a5a5a; display: none; }
    .usage { font-size: 11px; color: var(--muted); padding: 2px 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <span class="title">iCode</span>
      <span id="status">连接中…</span>
    </div>
    <div id="body">
      <div id="sidebar">
        <div id="sessions"></div>
        <button id="newSession">+ 新会话</button>
      </div>
      <div id="main">
        <div id="modelbar">
          <span style="color:var(--muted)">模型</span>
          <select id="model"><option>加载中…</option></select>
        </div>
        <div id="messages"></div>
        <div class="usage" id="usage"></div>
        <div id="inputbar">
          <textarea id="input" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
          <button id="send">发送</button>
          <button id="stop">停止</button>
        </div>
      </div>
    </div>
  </div>

  <script nonce="${nonce}">
    (function () {
      const vscode = acquireVsCodeApi();
      const $ = (id) => document.getElementById(id);
      const sessionsEl = $('sessions');
      const messagesEl = $('messages');
      const modelEl = $('model');
      const inputEl = $('input');
      const statusEl = $('status');
      const usageEl = $('usage');

      const state = {
        sessions: [],
        models: [],
        active: null,
        streaming: false,
        msgs: {},     // sessionId -> [{role, content, kind}]
        assistantNode: null,
      };

      function post(msg) { vscode.postMessage(msg); }

      function setStatus(text, ok) {
        statusEl.textContent = text;
        statusEl.style.color = ok ? 'var(--ok)' : 'var(--muted)';
      }

      function renderSessions() {
        sessionsEl.innerHTML = '';
        state.sessions.forEach((s) => {
          const div = document.createElement('div');
          div.className = 'session-item' + (s.id === state.active ? ' active' : '');
          div.textContent = s.title || s.id || '会话';
          div.title = s.id;
          div.onclick = () => selectSession(s.id);
          sessionsEl.appendChild(div);
        });
      }

      function renderModels() {
        modelEl.innerHTML = '';
        if (!state.models.length) {
          const o = document.createElement('option');
          o.textContent = '默认模型';
          modelEl.appendChild(o);
          return;
        }
        state.models.forEach((m) => {
          const o = document.createElement('option');
          o.value = m.provider + '::' + (m.model_id || m.id);
          o.textContent = (m.name || m.id) + ' (' + m.provider + ')';
          modelEl.appendChild(o);
        });
      }

      function currentModel() {
        const v = modelEl.value || '';
        const [provider, model] = v.split('::');
        return { provider: provider || '', model: model || '' };
      }

      function addSession(s) {
        if (!state.sessions.find((x) => x.id === s.id)) {
          state.sessions.push(s);
        }
        renderSessions();
      }

      function selectSession(id) {
        state.active = id;
        state.assistantNode = null;
        renderSessions();
        renderMessages();
      }

      function renderMessages() {
        messagesEl.innerHTML = '';
        const list = state.msgs[state.active] || [];
        list.forEach((m) => appendMsgEl(m));
        scrollBottom();
      }

      function appendMsgEl(m) {
        if (m.kind === 'tool') {
          const d = document.createElement('div');
          d.className = 'msg tool';
          d.innerHTML = '<div class="tool-call"><span class="name">' +
            escapeHtml(m.name) + '</span>\n' + escapeHtml(m.content) + '</div>';
          messagesEl.appendChild(d);
          return;
        }
        const d = document.createElement('div');
        d.className = 'msg ' + (m.role === 'user' ? 'user' : m.kind === 'thinking' ? 'thinking' : m.kind === 'error' ? 'error' : 'assistant');
        d.textContent = m.content;
        messagesEl.appendChild(d);
        return d;
      }

      function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

      function escapeHtml(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      }

      function pushMsg(role, content, kind) {
        const list = state.msgs[state.active] || (state.msgs[state.active] = []);
        const m = { role, content, kind: kind || (role === 'user' ? 'user' : 'assistant') };
        list.push(m);
        return appendMsgEl(m);
      }

      function newSession() {
        const id = 'vsc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const m = currentModel();
        post({ type: 'createSession', id, title: 'VS Code 会话', model: m.model, provider: m.provider });
      }

      function send() {
        const text = inputEl.value.trim();
        if (!text || state.streaming) { return; }
        if (!state.active) {
          // create first, then send on creation
          const id = 'vsc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
          const m = currentModel();
          state.pendingText = text;
          post({ type: 'createSession', id, title: 'VS Code 会话', model: m.model, provider: m.provider });
          inputEl.value = '';
          return;
        }
        doSend(text);
        inputEl.value = '';
      }

      function doSend(text) {
        pushMsg('user', text, 'user');
        state.streaming = true;
        $('send').style.display = 'none';
        $('stop').style.display = 'inline-block';
        usageEl.textContent = '';
        const m = currentModel();
        state.assistantNode = pushMsg('assistant', '', 'assistant');
        post({ type: 'send', sessionId: state.active, content: text, model: m.model, provider: m.provider });
      }

      function onStream(sessionId, ev) {
        if (sessionId !== state.active) { return; }
        const t = ev.type;
        if (t === 'text') {
          if (!state.assistantNode) { state.assistantNode = pushMsg('assistant', '', 'assistant'); }
          state.assistantNode.textContent += ev.content;
          scrollBottom();
        } else if (t === 'thinking') {
          pushMsg('assistant', ev.content, 'thinking');
        } else if (t === 'tool_use') {
          const tc = ev.tool_call || {};
          pushMsg('tool', '🔧 ' + (tc.name || 'tool') + '\n' + (tc.arguments || ''), 'tool');
        } else if (t === 'permission') {
          renderPermission(ev.permission);
        } else if (t === 'done') {
          if (ev.meta && ev.meta.usage) {
            const u = ev.meta.usage;
            usageEl.textContent = 'tokens: ' + (u.total_tokens || 0) +
              (u.cache_hit_tokens ? '  ·  缓存命中 ' + u.cache_hit_tokens : '');
          }
        } else if (t === 'error') {
          pushMsg('assistant', ev.content || '错误', 'error');
        }
      }

      function renderPermission(p) {
        const d = document.createElement('div');
        d.className = 'perm';
        d.innerHTML = '<div>🔐 需要权限：' + escapeHtml(p.tool || '') + '</div>' +
          '<div style="color:var(--muted);font-size:12px">' + escapeHtml(p.prompt || '') + '</div>' +
          '<div class="btns">' +
          '<button class="allow" data-d="allow">允许</button>' +
          '<button class="allow" data-d="allow_all">总是允许</button>' +
          '<button class="deny" data-d="deny">拒绝</button>' +
          '</div>';
        d.querySelectorAll('button').forEach((b) => {
          b.onclick = () => {
            post({ type: 'permissionRespond', requestId: p.request_id, decision: b.getAttribute('data-d') });
            d.remove();
          };
        });
        messagesEl.appendChild(d);
        scrollBottom();
      }

      function onStreamEnd() {
        state.streaming = false;
        state.assistantNode = null;
        $('send').style.display = 'inline-block';
        $('stop').style.display = 'none';
      }

      function showError(msg) {
        setStatus('错误: ' + msg, false);
        pushMsg('assistant', '⚠️ ' + msg, 'error');
      }

      // ── message router ──
      window.addEventListener('message', (e) => {
        const m = e.data;
        switch (m.type) {
          case 'status':
            setStatus('已连接 :' + m.port, true);
            post({ type: 'listSessions' });
            post({ type: 'listModels' });
            break;
          case 'sessions':
            state.sessions = m.payload || [];
            if (!state.active && state.sessions.length) { selectSession(state.sessions[0].id); }
            renderSessions();
            break;
          case 'models':
            state.models = m.payload || [];
            renderModels();
            break;
          case 'sessionCreated': {
            addSession(m.session);
            selectSession(m.session.id);
            if (state.pendingText) {
              const txt = state.pendingText; state.pendingText = null;
              doSend(txt);
            }
            break;
          }
          case 'stream':
            onStream(m.sessionId, m.event);
            break;
          case 'streamEnd':
            onStreamEnd();
            break;
          case 'error':
            showError(m.message);
            onStreamEnd();
            break;
          case 'insertPrompt':
            // From editor context menu: prefill (and optionally auto-send) a prompt.
            inputEl.value = m.text || '';
            inputEl.focus();
            if (m.autoSend && !state.streaming) { send(); }
            break;
        }
      });

      // ── UI events ──
      $('newSession').onclick = newSession;
      $('send').onclick = send;
      $('stop').onclick = () => { post({ type: 'stop', sessionId: state.active }); };
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        // Esc — interrupt an in-flight generation (mirrors the desktop app).
        if (e.key === 'Escape') {
          if ($('stop').style.display !== 'none') {
            post({ type: 'stop', sessionId: state.active });
          }
          e.preventDefault();
        }
      });

      // boot
      post({ type: 'ready' });
    })();
  </script>
</body>
</html>
